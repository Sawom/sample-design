<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopMax - Login</title>
    <link href="css/bootstrap.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>

<body>

    <!-- Top Header -->
    <div class="top-header text-white py-2">
        <div class="container d-flex justify-content-between align-items-center">
            <div><span>Email: info@shopmax.com</span></div>
            <div><span id="current-date-time" class="text-warning"></span></div>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="full-width-nav navbar navbar-expand-lg p-0 sticky-top">
        <div class="container-fluid px-0">
            <a class="navbar-brand fw-bold fs-3 px-3" href="index.html" style="color: var(--primary-color);">ShopMax</a>
            <div class="collapse navbar-collapse" id="ecommerceNavbar">
                <ul class="navbar-nav w-100 justify-content-center">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="products.html">Product</a></li>
                    <li class="nav-item"><a class="nav-link" href="signup.html">Signup</a></li>
                    <li class="nav-item"><a class="nav-link active" href="login.html">Login</a></li>
                    <li class="nav-item"><a class="nav-link" href="cart.html">Cart Page</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Breadcrumb -->
    <div class="breadcrumb-wrapper">
        <div class="container">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a href="index.html">Home</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Login</li>
                </ol>
            </nav>
        </div>
    </div>

    <main class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card p-4 shadow-sm border-0">
                    <h3 class="fw-bold mb-4 text-center">Login to Account</h3>
                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">User Name</label>
                            <input type="text" class="form-control" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Password</label>
                            <input type="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-theme w-100 py-2 fw-semibold">Sign In</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Confirmation Popup Window -->
    <div class="modal fade" id="confirmationModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header text-white" style="background-color: var(--primary-color);">
                    <h5 class="modal-title">Success</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p id="modalMessage" class="mb-0"></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="bottom-footer py-3 text-center mt-auto">
        <p class="mb-0">&copy; 2026 ShopMax Ecommerce. All Rights Reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
