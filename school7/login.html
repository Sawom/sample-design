<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Login - Greenwood Model School</title>
    <link href="css/bootstrap.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Header Top Section -->
    <div class="top-header">
        <div class="container-fluid px-4">
            <div class="row align-items-center">
                <div class="col-md-8 d-flex align-items-center gap-3">
                    <span><i class="fa-solid fa-clock me-1"></i> <span id="currentDateTime">Loading...</span></span>
                </div>
                <div class="col-md-4 text-end">
                    <a href="login.html" class="btn btn-sm btn-outline-info text-white active"><i
                            class="fa-solid fa-right-to-bracket me-1"></i> Login</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Navigation Section -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="index.html"><i class="fa-solid fa-graduation-cap me-2"></i>Greenwood
                School</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#schoolNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="schoolNavbar">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 w-100 justify-content-between px-3">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="teacher.html">Teacher</a></li>
                    <li class="nav-item"><a class="nav-link" href="student.html">Student</a></li>
                    <li class="nav-item"><a class="nav-link" href="result.html">Result</a></li>
                    <li class="nav-item"><a class="nav-link" href="academic.html">Academic</a></li>
                    <li class="nav-item"><a class="nav-link active" href="login.html">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Breadcrumb Section -->
    <div class="bg-breadcrumb mb-4">
        <div class="container">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0 py-2">
                    <li class="breadcrumb-item"><a href="index.html">Home</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Portal Login</li>
                </ol>
            </nav>
        </div>
    </div>

    <!-- Login Form Section -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm border-0 rounded-3 p-4">
                    <div class="text-center mb-4">
                        <i class="fa-solid fa-user-shield fa-3x text-primary mb-2"></i>
                        <h3 class="fw-bold">School Portal Login</h3>
                        <p class="text-muted small">Sign in for Students, Teachers & Staff</p>
                    </div>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="username" class="form-label">User Name</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                                <input type="text" class="form-control" id="username" placeholder="Enter ID or Username"
                                    required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-key"></i></span>
                                <input type="password" class="form-control" id="password" placeholder="Enter Password"
                                    required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold"><i
                                class="fa-solid fa-right-to-bracket me-1"></i> Submit Login</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer Section -->
    <footer class="big-footer mt-auto">
        <div class="container text-center">
            <p>&copy; 2026 Greenwood Model School. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
